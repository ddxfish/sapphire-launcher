[package]
name = "sapphire-launcher"
version = "0.9.6"
edition = "2024"

[dependencies]
# Software renderer only (tiny-skia, no wgpu): one render path on every platform,
# no GPU-driver dependency. Plenty for a static launcher UI, and it makes the Linux
# AppImage portable (no Vulkan/GL libs to bundle/match). Re-add the non-wgpu defaults
# (tiny-skia, fira-sans bundled font, auto-detect-theme) since default-features=false.
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "fira-sans", "auto-detect-theme", "image", "tokio"] }
image = "0.24"
tokio = { version = "1", features = ["rt", "process", "sync", "io-util", "macros", "fs"] }
tokio-stream = "0.1"
futures = "0.3"
rfd = "0.15"
serde_json = "1"

# Windows only: console APIs for the graceful Stop (CTRL_BREAK to Sapphire's process
# group). Same windows-sys version rfd already pulls in, so no new crate version.
# Unix only: direct kill/killpg syscalls for Stop. Never shell out to /usr/bin/kill:
# procps-ng 4.x parses `kill -TERM -1522700` as kill(-1, SIGTERM) = the whole session.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
winres = "0.1"
image = "0.24"

[profile.release]
strip = true
lto = true
opt-level = "z"
